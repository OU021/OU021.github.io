<main class="shell" id="main"><section class="photography-page" data-photo-region data-lang="zh" lang="zh-Hant"><header class="photo-heading"><a class="back" href="../"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg><span data-photo-lang="zh" lang="zh-Hant">學術主頁</span><span data-photo-lang="en" lang="en">Academic homepage</span></a><div class="photo-heading-row"><h1><span data-photo-lang="zh" lang="zh-Hant">攝影</span><span data-photo-lang="en" lang="en">Photography</span></h1><div class="photo-language" role="group" aria-label="Photography language" hidden><button type="button" data-set-photo-lang="zh" aria-pressed="true" lang="zh-Hant">中文</button><span aria-hidden="true">/</span><button type="button" data-set-photo-lang="en" aria-pressed="false" lang="en">English</button></div></div><p><span data-photo-lang="zh" lang="zh-Hant">一些風景，和留在照片裡的日子。</span><span data-photo-lang="en" lang="en">Places, people, and days I want to remember.</span></p><p class="preview-hint"><span data-photo-lang="zh" lang="zh-Hant">點開照片，讀讀它的故事。</span><span data-photo-lang="en" lang="en">Click a photo for its story.</span></p></header><div class="gallery"><figure class="photo" id="photo-fuji-sunset"><a href="../assets/photos/digital3.webp" data-figure data-album="gallery" data-photo-title-en="Mount Fuji at sunset" data-photo-title-zh="落日時分的富士山" data-photo-caption-en="Mount Fuji at sunset, photographed from a moving coach." data-photo-caption-zh="落日時分的富士山，在移動的大巴上拍的。" data-photo-meta-en="Japan · Jan 2024" data-photo-meta-zh="日本 · 2024 年 1 月" data-photo-alt-en="Mount Fuji silhouetted against an orange sunset, viewed from a moving coach" data-photo-alt-zh="從行駛的大巴上拍到、映著橙色落日的富士山" aria-label="查看照片：落日時分的富士山"><img src="../assets/photos/digital3.webp" width="1439" height="1080" alt="從行駛的大巴上拍到、映著橙色落日的富士山" fetchpriority="high" decoding="async"><span class="photo-stamp" lang="en"><time datetime="2024-01">Jan 2024</time><span aria-hidden="true"> · </span><span>Japan</span></span></a></figure><figure class="photo" id="photo-kamakura-seaside"><a href="../assets/photos/digital1.webp" data-figure data-album="gallery" data-photo-title-en="Passing by the sea" data-photo-title-zh="路過鐮倉的海" data-photo-caption-en="Near Kamakurakōkōmae Station, photographed through the window of a moving coach." data-photo-caption-zh="在鐮倉高校前駅附近，也是從行駛的大巴上拍到的。" data-photo-meta-en="Near Kamakurakōkōmae Station, Japan · Jan 2024" data-photo-meta-zh="日本・鐮倉高校前駅附近 · 2024 年 1 月" data-photo-alt-en="Two people sitting beside a blue seaside promenade" data-photo-alt-zh="鐮倉海邊，兩個人坐在藍色海岸步道旁" aria-label="查看照片：路過鐮倉的海"><img src="../assets/photos/digital1.webp" width="1439" height="1080" alt="鐮倉海邊，兩個人坐在藍色海岸步道旁" fetchpriority="high" decoding="async"><span class="photo-stamp" lang="en"><time datetime="2024-01">Jan 2024</time><span aria-hidden="true"> · </span><span>Japan</span></span></a></figure><figure class="photo" id="photo-kamakura-youth"><a href="../assets/photos/digital2.webp" data-figure data-album="gallery" data-photo-title-en="A little bit of youth" data-photo-title-zh="很青春的一張" data-photo-caption-en="Another glimpse of the beach from the same coach ride. There is something wonderfully youthful about this photograph." data-photo-caption-zh="同一天、同一段大巴旅程拍到的海灘。我覺得這張很青春。" data-photo-meta-en="Near Kamakurakōkōmae Station, Japan · Jan 2024" data-photo-meta-zh="日本・鐮倉高校前駅附近 · 2024 年 1 月" data-photo-alt-en="Small groups casting long shadows on a sunlit beach" data-photo-alt-zh="鐮倉的沙灘上，幾組人投下長長的影子" aria-label="查看照片：很青春的一張"><img src="../assets/photos/digital2.webp" width="1439" height="1081" alt="鐮倉的沙灘上，幾組人投下長長的影子" loading="lazy" decoding="async"><span class="photo-stamp" lang="en"><time datetime="2024-01">Jan 2024</time><span aria-hidden="true"> · </span><span>Japan</span></span></a></figure><figure class="photo" id="photo-fuji-magic-hat"><a href="../assets/photos/digital4.webp" data-figure data-album="gallery" data-photo-title-en="Fuji in a magic hat" data-photo-title-zh="戴著魔法帽子的富士山" data-photo-caption-en="Mount Fuji wearing what looks to me like a magic hat. The weather was lovely that day. I was lucky." data-photo-caption-zh="戴著魔法帽子的富士山。那天天氣很好，我的運氣很好。" data-photo-meta-en="Japan · Jan 2024" data-photo-meta-zh="日本 · 2024 年 1 月" data-photo-alt-en="Mount Fuji capped by a cloud, reflected in a still lake" data-photo-alt-zh="頂著一朵帽子般的雲、倒映在湖面上的富士山" aria-label="查看照片：戴著魔法帽子的富士山"><img src="../assets/photos/digital4.webp" width="1439" height="1080" alt="頂著一朵帽子般的雲、倒映在湖面上的富士山" loading="lazy" decoding="async"><span class="photo-stamp" lang="en"><time datetime="2024-01">Jan 2024</time><span aria-hidden="true"> · </span><span>Japan</span></span></a></figure><figure class="photo" id="photo-cherry-blossoms-sea"><a href="../assets/photos/digital16.webp" data-figure data-album="gallery" data-photo-title-en="Cherry blossoms and the sea" data-photo-title-zh="櫻花與海" data-photo-caption-en="Cherry blossoms and the sea in Dalian." data-photo-caption-zh="大連，櫻花與海。" data-photo-meta-en="Dalian, China · Apr 2024" data-photo-meta-zh="大連 · 2024 年 4 月" data-photo-alt-en="A flowering branch overlooking a blue bay" data-photo-alt-zh="櫻花枝條下方是一片藍色海灣" aria-label="查看照片：櫻花與海"><img src="../assets/photos/digital16.webp" width="1439" height="1080" alt="櫻花枝條下方是一片藍色海灣" loading="lazy" decoding="async"><span class="photo-stamp" lang="en"><time datetime="2024-04">Apr 2024</time><span aria-hidden="true"> · </span><span>Dalian</span></span></a></figure><figure class="photo" id="photo-sea-daydream"><a href="../assets/photos/digital15.webp" data-figure data-album="gallery" data-photo-title-en="Time to stare at the sea" data-photo-title-zh="對著海發呆的時刻" data-photo-caption-en="Such clear water—it lifts my spirits just to look at it. Life needs plenty of moments spent doing nothing but gazing at the sea." data-photo-caption-zh="非常乾淨的海，讓人看了心情很好。人生需要很多對著海發呆的時刻。" data-photo-meta-en="Dalian, China · Apr 2024" data-photo-meta-zh="大連 · 2024 年 4 月" data-photo-alt-en="A calm blue bay viewed from a rocky hillside" data-photo-alt-zh="從岩石山坡望向乾淨、平靜的藍色海灣" aria-label="查看照片：對著海發呆的時刻"><img src="../assets/photos/digital15.webp" width="1439" height="1080" alt="從岩石山坡望向乾淨、平靜的藍色海灣" loading="lazy" decoding="async"><span class="photo-stamp" lang="en"><time datetime="2024-04">Apr 2024</time><span aria-hidden="true"> · </span><span>Dalian</span></span></a></figure><figure class="photo" id="photo-yuexiu-cat"><a href="../assets/photos/digital11.webp" data-figure data-album="gallery" data-photo-title-en="Passing through her world" data-photo-title-zh="路過她的世界" data-photo-caption-en="A chance encounter in Yuexiu Park. Thank you, little cat, for letting me pass through your world." data-photo-caption-zh="在越秀公園偶遇的小貓。謝謝小貓允許我路過她的世界。" data-photo-meta-en="Yuexiu Park, Guangzhou · Jul 2023" data-photo-meta-zh="廣州・越秀公園 · 2023 年 7 月" data-photo-alt-en="A ginger-and-white cat looking toward the camera" data-photo-alt-zh="越秀公園裡，一隻橘白小貓望向鏡頭" aria-label="查看照片：路過她的世界"><img src="../assets/photos/digital11.webp" width="1500" height="1000" alt="越秀公園裡，一隻橘白小貓望向鏡頭" loading="lazy" decoding="async"><span class="photo-stamp" lang="en"><time datetime="2023-07">Jul 2023</time><span aria-hidden="true"> · </span><span>Guangzhou</span></span></a></figure><figure class="photo" id="photo-monkey-family"><a href="../assets/photos/digital14.webp" data-figure data-album="gallery" data-photo-title-en="On the other side of the glass" data-photo-title-zh="隔著玻璃" data-photo-caption-en="A mother monkey and her baby, with glass between us. Its green tint makes it look almost as though they are in a forest. It is actually quite painful to look at." data-photo-caption-zh="猴子媽媽和寶寶，我們隔著玻璃。玻璃綠綠的，好像他們在叢林一樣，其實蠻難受的……" data-photo-meta-en="Dalian Zoo · Sep 2024" data-photo-meta-zh="大連動物園 · 2024 年 9 月" data-photo-alt-en="Two golden-furred monkeys sitting behind glass" data-photo-alt-zh="隔著綠色玻璃拍到的猴子媽媽和寶寶" aria-label="查看照片：隔著玻璃"><img src="../assets/photos/digital14.webp" width="1439" height="1080" alt="隔著綠色玻璃拍到的猴子媽媽和寶寶" loading="lazy" decoding="async"><span class="photo-stamp" lang="en"><time datetime="2024-09">Sep 2024</time><span aria-hidden="true"> · </span><span>Dalian</span></span></a></figure><figure class="photo" id="photo-tiger-feeding"><a href="../assets/photos/digital13.webp" data-figure data-album="gallery" data-photo-title-en="A wider world" data-photo-title-zh="本來更廣闊的世界" data-photo-caption-en="Feeding a tiger. This photograph feels oppressive to me. Visits to the zoo always leave me sad; these animals could have had a much wider, freer world." data-photo-caption-zh="餵食老虎。看這張會有一種壓抑的感覺，去動物園總是讓我感到難過。他們本來擁有更廣闊、更自由的世界。" data-photo-meta-en="Dalian Zoo · Sep 2024" data-photo-meta-zh="大連動物園 · 2024 年 9 月" data-photo-alt-en="A tiger being fed through a barrier at Dalian Zoo" data-photo-alt-zh="大連動物園裡，隔著屏障餵食老虎的場景" aria-label="查看照片：本來更廣闊的世界"><img src="../assets/photos/digital13.webp" width="1439" height="1080" alt="大連動物園裡，隔著屏障餵食老虎的場景" loading="lazy" decoding="async"><span class="photo-stamp" lang="en"><time datetime="2024-09">Sep 2024</time><span aria-hidden="true"> · </span><span>Dalian</span></span></a></figure><figure class="photo" id="photo-miyi-tomatoes"><a href="../assets/photos/digital6.webp" data-figure data-album="gallery" data-photo-title-en="Two kinds of tomatoes" data-photo-title-zh="兩種番茄" data-photo-caption-en="A vegetable farmer picked two varieties for me to try. One was called kougan tomato; I have forgotten the other name. Both were delicious!" data-photo-caption-zh="菜農叔叔摘了兩種不同品種的番茄給我嘗。一個叫口感番茄，另一個叫什麼番茄來著，我有一點忘記。很好吃！" data-photo-meta-en="Miyi County, Panzhihua · Mar 2026" data-photo-meta-zh="攀枝花・米易縣 · 2026 年 3 月" data-photo-alt-en="Two red tomatoes held in a garden" data-photo-alt-zh="在米易縣的菜地裡，手中拿著兩種番茄" aria-label="查看照片：兩種番茄"><img src="../assets/photos/digital6.webp" width="1500" height="1000" alt="在米易縣的菜地裡，手中拿著兩種番茄" loading="lazy" decoding="async"><span class="photo-stamp" lang
